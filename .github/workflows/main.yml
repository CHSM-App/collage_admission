name: Build & Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
 
      - name: Install frontend deps
        run: npm install
        working-directory: FrontEnd

      - name: Build frontend
        # VITE_API_URL is read from FrontEnd/.env.production (single source of truth).
        run: npm run build
        working-directory: FrontEnd

      - name: Deploy backend branch
        run: |
          cd BackEnd

          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Init a fresh repo in BackEnd/ (now contains the built frontend in public/)
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          # Stage everything in BackEnd/
          git add -A
          git commit -m "deploy: ${{ github.sha }}"

          # Force push to backend branch
          git push origin HEAD:backend --force






          


          